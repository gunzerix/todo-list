events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS resolver — lets nginx re-resolve "app" whenever
  # you scale it (docker compose up --scale app=3), instead of caching a
  # single IP at startup.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location / {
      set $upstream_app app:3000;
      proxy_pass http://$upstream_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      set $upstream_app app:3000;
      proxy_pass http://$upstream_app/health;
    }
  }
}
