<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App — Cloud DevOps Final Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
